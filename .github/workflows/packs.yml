name: Region packs

# Builds the downloadable region packs and publishes them under the fixed "packs" release, so the
# extension can always fetch:
#   https://github.com/<owner>/<repo>/releases/download/packs/regions.json
#
# The release is marked as a pre-release, and that matters: GitHub resolves /releases/latest to the
# most recent release that is neither draft nor pre-release. Publishing the packs as an ordinary
# release makes them "latest", which breaks the app's own update check - it reads manifest.json from
# /releases/latest/download/, and the packs release has no such file.
#
# The data comes from each country's OpenStreetMap dump, read with osmium: one download and about a
# minute of filtering. Overpass is not asked - it is a donated service sized for small interactive
# queries, and its usage policy points a scheduled build of a whole country at the regional dumps.
#
# Runs monthly, since signs in OpenStreetMap change slowly, and on demand from the Actions tab.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Only build this region id (blank builds all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Which countries this run covers. A country is built on its own runner: Germany is a five
  # gigabyte download where Denmark is half a one, and one country failing should not take the
  # others with it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: list
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.region }}" ]; then
            printf 'regions=["%s"]\n' "${{ inputs.region }}" >> "$GITHUB_OUTPUT"
          else
            printf 'regions=%s\n' "$(node tools/build-packs.mjs --list)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One country's mirror having a bad day is no reason to leave the rest unbuilt.
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    # Denmark is two minutes of work; Germany is ten times the data. The ceiling is for a slow
    # mirror, not for the build itself.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      # Germany is five gigabytes of dump and another one and a half of roads filtered out of it,
      # and France is the same again. The runner ships with several gigabytes of toolchains this
      # build never touches, and they are worth more as free space.
      - name: Make room for the big countries
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: The map's logic still matches the extension
        run: node tools/verify-map-parity.mjs

      - name: Build ${{ matrix.region }}
        run: node tools/build-packs.mjs --region "${{ matrix.region }}" --out build/packs

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.region }}
          path: build/packs
          retention-days: 1

  publish:
    needs: build
    # A country that failed keeps the pack it already had on the release, so the ones that did
    # build are still worth publishing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          merge-multiple: true
          path: build/packs

      - name: Nothing to publish?
        run: |
          set -euo pipefail
          ls build/packs/*.json >/dev/null

      # A country read from a dump either works or fails loudly, but a truncated download or a
      # mis-cut extract could still leave a pack quietly short of signs. Compare against what is
      # published before replacing it.
      - name: The new packs are not smaller than the published ones
        run: node tools/check-packs.mjs build/packs

      # Only the countries built this run are in hand, so the catalogue keeps the entries of the
      # ones that were not - otherwise they would vanish from the app's list.
      - name: Write the catalogue
        run: node tools/merge-catalog.mjs build/packs

      - name: Summarise
        run: |
          {
            echo '### Region packs'
            echo
            echo '| Region | Signs | Cells | Size | Files |'
            echo '| --- | --- | --- | --- | --- |'
            for index in build/packs/*.json; do
              case "$index" in *regions.json|*-[0-9][0-9][0-9].json) continue ;; esac
              jq -r '"| \(.name) | \(.signs) | \(.cells) | \(.bytes/1024 | floor) kB | \(.chunks | length) |"' "$index"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view packs >/dev/null 2>&1; then
            gh release create packs \
              --prerelease \
              --title "Region packs" \
              --notes "Sign data prepared for offline use, rebuilt monthly from the OpenStreetMap country dumps. Downloaded from the extension's settings screen.

          Marked as a pre-release on purpose, so it never becomes the repository's \"latest\" release: the app reads manifest.json from there to find updates."
          fi
          # Enforce it on every run, including for a release created before this was in place.
          gh release edit packs --prerelease --latest=false
          gh release upload packs build/packs/*.json --clobber
