name: Release

# Tag a version to publish it:
#   git tag -a v1.0 -m "What changed" && git push origin v1.0
# The tag has to match versionName in app/build.gradle.kts, and versionCode has to go up for
# Karoo to see the release as an update.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Verification map matches the extension logic
        run: node tools/verify-map-parity.mjs

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, signing with the debug key. Karoo cannot update an install signed with a different key - it has to be uninstalled first."
          fi

      - name: Assemble the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect the APK and build the Karoo manifest
        id: package
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          apk=$(jq -r '.elements[0].outputFile' "$metadata")
          version=$(jq -r '.elements[0].versionName' "$metadata")
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          cp "app/build/outputs/apk/release/$apk" citylimit.apk

          notes=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            notes=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          fi

          # Pinned to this version's own tag rather than /latest/, so the download keeps working
          # even if another release later becomes the repository's latest.
          jq --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/citylimit.apk" \
             --arg icon "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/icon.png" \
             --arg version "$version" \
             --argjson code "$code" \
             --arg notes "$notes" \
             '.latestApkUrl = $apk
              | .iconUrl = $icon
              | .latestVersion = $version
              | .latestVersionCode = $code
              | if $notes == "" then . else .releaseNotes = $notes end' \
             app/karoo-manifest.json > manifest.json

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          cat manifest.json

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.package.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName ${{ steps.package.outputs.version }} in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          CODE: ${{ steps.package.outputs.code }}
        run: |
          set -euo pipefail
          assets="citylimit.apk manifest.json docs/icon.png"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets \
              --title "City Limit $VERSION" \
              --notes "Version $VERSION (versionCode $CODE).

          Install on the Karoo with \`adb install -r citylimit.apk\`. Once installed, Karoo picks up later releases through the manifest in this release."
          fi
