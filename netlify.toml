# Publishes the verification map as a static site. Netlify needs no build step: the page is a
# single self-contained HTML file that reads a region pack.
#
# Set up once at netlify.com: Add new site → Import an existing project → pick this repository.
# Everything below is picked up automatically, so no settings have to be filled in by hand.

[build]
  publish = "tools"
  command = ""
  functions = "netlify/functions"

# The packs live on a GitHub release, and GitHub redirects those downloads to a host that sends no
# CORS headers, so netlify/functions/packs.mjs fetches them server-side and serves /api/packs from
# this origin. Nothing here talks to Overpass: the OpenStreetMap usage policy asks that apps
# deployed on platforms like netlify.app do not, and the map has no need to.

# The map is the only page worth serving, so make it the front page.
[[redirects]]
  from = "/"
  to = "/verify-map.html"
  status = 302

[[headers]]
  for = "/verify-map.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
